<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Antenna P2P Chat</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: system-ui, sans-serif;
            background: #1a1a2e;
            color: #eee;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            padding: 40px 20px;
        }
        .container { max-width: 680px; width: 100%; }
        h1 { margin-bottom: 24px; font-size: 22px; }
        .section { margin-bottom: 20px; }
        label {
            display: block;
            font-size: 13px;
            color: #888;
            margin-bottom: 6px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        textarea, input {
            width: 100%;
            padding: 10px;
            border: 1px solid #333;
            border-radius: 6px;
            background: #16213e;
            color: #eee;
            font-family: monospace;
            font-size: 13px;
        }
        textarea { resize: vertical; min-height: 80px; }
        textarea:focus, input:focus { outline: none; border-color: #e94560; }
        button {
            padding: 10px 20px;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-size: 14px;
            font-weight: 500;
            color: #fff;
            background: #e94560;
            transition: opacity 0.2s;
        }
        button:hover { opacity: 0.85; }
        button:disabled { opacity: 0.4; cursor: not-allowed; }
        .status {
            padding: 10px;
            background: #16213e;
            border-radius: 6px;
            font-size: 14px;
            border-left: 3px solid #e94560;
        }
        .log {
            background: #0f3460;
            border-radius: 6px;
            padding: 12px;
            height: 220px;
            overflow-y: auto;
            font-family: monospace;
            font-size: 13px;
            white-space: pre-wrap;
        }
        .chat-input { display: flex; gap: 8px; margin-top: 8px; }
        .chat-input input { flex: 1; }
        .hidden { display: none !important; }
        .mt { margin-top: 8px; }
        .id-row { display: flex; gap: 8px; }
        .id-row input { flex: 1; }
        .muted { color: #888; font-size: 12px; }
        ul.peer-list {
            list-style: none;
            padding: 10px;
            background: #16213e;
            border-radius: 6px;
            font-family: monospace;
            font-size: 13px;
        }
        ul.peer-list li + li { margin-top: 6px; }
    </style>
</head>
<body>
<div class="container">
    <h1>Antenna P2P Chat</h1>

    <div class="section" id="setup-section">
        <label>Local peer</label>
        <div class="id-row">
            <input id="turn" placeholder="TURN addr (optional in UI, demo default is used)" />
            <button onclick="initApp()">Initialize</button>
        </div>
        <div class="muted mt">Initialize once, then reuse the controls below to connect more peers.</div>
    </div>

    <div class="section hidden" id="connect-section">
        <label>Manual bootstrap</label>
        <div class="id-row">
            <button onclick="chooseHost()" style="width:100%">Create offer</button>
        </div>
        <div class="id-row mt">
            <button onclick="chooseJoiner()" style="width:100%">Accept offer from peer</button>
        </div>
    </div>

    <div id="host-flow" class="hidden">
        <div class="section">
            <label>Your offer for target peer</label>
            <textarea id="offer-out" readonly></textarea>
        </div>
        <div class="section">
            <label>Paste answer from target peer</label>
            <textarea id="answer-in"></textarea>
            <button class="mt" onclick="hostAcceptAnswer()">Accept answer</button>
        </div>
    </div>

    <div id="joiner-flow" class="hidden">
        <div class="section">
            <label>Paste offer from target peer</label>
            <textarea id="offer-in"></textarea>
            <button class="mt" onclick="joinerAcceptOffer()">Accept offer & generate answer</button>
        </div>
        <div class="section">
            <label>Your answer for target peer</label>
            <textarea id="answer-out" readonly></textarea>
        </div>
    </div>

    <div class="section">
        <div class="status" id="status">Initialize local peer to start</div>
    </div>

    <div class="section hidden" id="mesh-section">
        <label>Connected peers</label>
        <ul class="peer-list" id="peer-list"></ul>
    </div>

    <div class="section hidden" id="chat-section">
        <label>Broadcast messages</label>
        <div class="log" id="log"></div>
        <div class="chat-input">
            <input id="msg" placeholder="Type a message for the whole mesh…" disabled />
            <button id="send-btn" onclick="sendMsg()" disabled>Broadcast</button>
        </div>
    </div>
</div>

<script type="module">
import init, { ChatApp } from './pkg/minimal_chat_example.js';

let app;
let pendingTargetId = '';

await init();

const $ = id => document.getElementById(id);

function status(text) {
    $('status').textContent = text;
}

function log(text) {
    const el = $('log');
    el.textContent += (el.textContent ? '\n' : '') + text;
    el.scrollTop = el.scrollHeight;
}

function ensureTargetId() {
    const targetId = $('target-id').value.trim();
    if (!targetId) {
        throw new Error('Enter target peer ID first');
    }
    return targetId;
}

function updatePeerViews() {
    if (!app) {
        $('peer-list').innerHTML = '<li>No app initialized</li>';
        return;
    }

    const peers = Array.from(app.connectedPeers());
    $('mesh-section').classList.remove('hidden');
    $('chat-section').classList.remove('hidden');

    if (peers.length === 0) {
        $('peer-list').innerHTML = '<li>No connected peers yet</li>';
    } else {
        $('peer-list').innerHTML = peers.map(peer => `<li>${peer}</li>`).join('');
    }

    const canSend = peers.length > 0;
    $('msg').disabled = !canSend;
    $('send-btn').disabled = !canSend;
}

function schedulePeerViewUpdate() {
    queueMicrotask(() => {
        try {
            updatePeerViews();
        } catch (_) {}
    });
}

function resetHandshakePanels() {
    $('host-flow').classList.add('hidden');
    $('joiner-flow').classList.add('hidden');
    $('offer-out').value = '';
    $('offer-in').value = '';
    $('answer-in').value = '';
    $('answer-out').value = '';
}

window.initApp = function() {
    const turn = $('turn').value.trim() || 'turn:demo-voicechat.quasarity.com:3478';

    try {
        app = new ChatApp(turn);

        app.onConnected(() => {
            status('At least one peer is connected');
            log('--- mesh connected ---');
            schedulePeerViewUpdate();
        });

        app.onMessage((peer, data) => {
            const text = typeof data === 'string'
                ? data
                : (data && typeof data.text === 'string' ? data.text : JSON.stringify(data));
            log(peer + ': ' + text);
            schedulePeerViewUpdate();
        });

        app.onDisconnected(() => {
            status('All peers disconnected');
            log('--- mesh disconnected ---');
            schedulePeerViewUpdate();
        });

        app.onPeerConnected((peer) => {
            status('Peer connected: ' + peer);
            log('--- peer connected: ' + peer + ' ---');
            schedulePeerViewUpdate();
        });

        app.onPeerDisconnected((peer) => {
            status('Peer disconnected: ' + peer);
            log('--- peer disconnected: ' + peer + ' ---');
            schedulePeerViewUpdate();
        });

        $('setup-section').classList.add('hidden');
        $('connect-section').classList.remove('hidden');
        status('Initialized. Share your Peer ID, then bootstrap with a peer.');
        updatePeerViews();
    } catch (e) {
        status('Error: ' + e);
        console.error(e);
    }
};

window.chooseHost = async function() {
    resetHandshakePanels();
    $('host-flow').classList.remove('hidden');
    status('Generating offer…');

    try {
        const offer = await app.startAsHost();
        $('offer-out').value = offer;
        status('Offer ready — copy and send it to the remote peer');
        log('Prepared host offer');
    } catch (e) {
        status('Error: ' + e);
        console.error(e);
    }
};

window.chooseJoiner = function() {
    resetHandshakePanels();
    $('joiner-flow').classList.remove('hidden');
    status('Paste the offer received from your peer');
};

window.hostAcceptAnswer = async function() {
    const answer = $('answer-in').value.trim();
    if (!answer) {
        return alert('Paste the answer first');
    }

    try {
        status('Applying answer…');
        await app.acceptAnswer(answer);
        status('Answer accepted');
        log('Accepted answer');
    } catch (e) {
        status('Error: ' + e);
        console.error(e);
    }
};

window.joinerAcceptOffer = async function() {
    const offer = $('offer-in').value.trim();
    if (!offer) {
        return alert('Paste the offer first');
    }

    try {
        status('Generating answer…');
        const answer = await app.acceptOffer(offer);
        $('answer-out').value = answer;
        status('Answer ready — copy and send it back');
        log('Prepared joiner answer');
    } catch (e) {
        status('Error: ' + e);
        console.error(e);
    }
};

window.sendMsg = async function() {
    const input = $('msg');
    const text = input.value.trim();
    if (!text) {
        return;
    }

    try {
        await app.broadcast(text);
        log('You (broadcast): ' + text);
        input.value = '';
    } catch (e) {
        status('Send error: ' + e);
        console.error(e);
    }
};

$('msg').addEventListener('keydown', e => {
    if (e.key === 'Enter') {
        sendMsg();
    }
});

log('Ready');
</script>

</body>
</html>
