[package]
name = "antenna"
version = "0.1.1"
edition = "2024"
rust-version.workspace = true
description = "WASM-compatible library for building P2P meshes over WebRTC."
license.workspace = true
repository.workspace = true
readme = "../../README.md"
keywords.workspace = true
categories.workspace = true

[features]
web = ["dep:antenna-client-web"]
native = ["dep:antenna-client-native"]
signaling-client = [
    "antenna-client-web?/signaling-client",
    "antenna-client-native?/signaling-client",
]

[dependencies]
antenna-protocol.workspace = true
antenna-client-shared.workspace = true
antenna-client-web = { workspace = true, optional = true }
antenna-client-native = { workspace = true, optional = true }

[package.metadata.docs.rs]
features = ["web", "signaling-client"]
targets = ["wasm32-unknown-unknown"]
