[workspace]
resolver = "2"
members = [
    "antenna",
    "protocol",
    "native",
    "web", 
    "example/*",
]

[workspace.package]
rust-version = "1.89.0"

[workspace.dependencies.antenna-protocol]
path = "protocol"

[workspace.dependencies.antenna-web]
path = "web"

[workspace.dependencies.antenna]
path = "antenna"

[workspace.dependencies.antenna-native]
path = "native"

[workspace.dependencies.anyhow]
version = "1.0.101"

[workspace.dependencies.serde]
version = "1.0.228"
features = ["derive"]

[workspace.dependencies.serde_json]
version = "1.0.149"

[workspace.dependencies.futures]
version = "0.3.32"

# WASM dependencies
[workspace.dependencies.wasm-bindgen]
version = "0.2"

[workspace.dependencies.wasm-bindgen-futures]
version = "0.4"

[workspace.dependencies.js-sys]
version = "0.3"

[workspace.dependencies.serde-wasm-bindgen]
version = "0.6"

[workspace.dependencies.web-sys]
version = "0.3"
features = [
    "RtcPeerConnection",
    "RtcConfiguration",
    "RtcDataChannel",
    "RtcDataChannelEvent",
    "RtcDataChannelInit",
    "RtcDataChannelState",
    "RtcDataChannelType",
    "RtcSdpType",
    "RtcSignalingState",
    "RtcSessionDescription",
    "RtcSessionDescriptionInit",
    "RtcIceServer",
    "RtcIceConnectionState",
    "RtcIceGatheringState",
    "MessageEvent",
    "ErrorEvent",
    "console",
]
