<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Antenna P2P Chat</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: system-ui, sans-serif;
            background: #1a1a2e;
            color: #eee;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            padding: 40px 20px;
        }
        .container { max-width: 560px; width: 100%; }
        h1 { margin-bottom: 24px; font-size: 22px; }
        .section { margin-bottom: 20px; }
        label {
            display: block; font-size: 13px; color: #888;
            margin-bottom: 6px; text-transform: uppercase; letter-spacing: 0.5px;
        }
        textarea, input {
            width: 100%; padding: 10px; border: 1px solid #333; border-radius: 6px;
            background: #16213e; color: #eee; font-family: monospace; font-size: 13px;
        }
        textarea { resize: vertical; min-height: 80px; }
        textarea:focus, input:focus { outline: none; border-color: #e94560; }
        button {
            padding: 10px 20px; border: none; border-radius: 6px; cursor: pointer;
            font-size: 14px; font-weight: 500; color: #fff; background: #e94560;
            transition: opacity 0.2s;
        }
        button:hover { opacity: 0.85; }
        button:disabled { opacity: 0.4; cursor: not-allowed; }
        .btn-row { display: flex; gap: 8px; }
        .status {
            padding: 10px; background: #16213e; border-radius: 6px;
            font-size: 14px; border-left: 3px solid #e94560;
        }
        .log {
            background: #0f3460; border-radius: 6px; padding: 12px; height: 180px;
            overflow-y: auto; font-family: monospace; font-size: 13px; white-space: pre-wrap;
        }
        .chat-input { display: flex; gap: 8px; margin-top: 8px; }
        .chat-input input { flex: 1; }
        .hidden { display: none !important; }
        .mt { margin-top: 8px; }
        .id-row { display: flex; gap: 8px; }
        .id-row input { flex: 1; }
    </style>
</head>
<body>
<div class="container">
    <h1>Antenna P2P Chat</h1>

    <!-- Step 0: Peer IDs -->
    <div class="section" id="step-ids">
        <label>Peer IDs</label>
         <div class="id-row">
            <input id="turn" placeholder="TURN addr" />
           
        </div>
        <div class="id-row">
            <input id="my-id" placeholder="Your ID (e.g., alice)" />
            <input id="remote-id" placeholder="Remote ID (e.g., bob)" />
        </div>
        <button class="mt" onclick="setIds()">Set IDs</button>
    </div>

    <!-- Step 1: Role -->
    <div class="section hidden" id="step-role">
        <label>Choose role</label>
        <div class="btn-row">
            <button onclick="chooseHost()">Host</button>
            <button onclick="chooseJoiner()">Joiner</button>
        </div>
    </div>

    <!-- Host flow -->
    <div id="host-flow" class="hidden">
        <div class="section">
            <label>Your offer (copy → send to peer)</label>
            <textarea id="offer-out" readonly></textarea>
        </div>
        <div class="section">
            <label>Paste answer from peer</label>
            <textarea id="answer-in"></textarea>
            <button class="mt" onclick="hostAcceptAnswer()">Connect</button>
        </div>
    </div>

    <!-- Joiner flow -->
    <div id="joiner-flow" class="hidden">
        <div class="section">
            <label>Paste offer from host</label>
            <textarea id="offer-in"></textarea>
            <button class="mt" onclick="joinerAcceptOffer()">Accept &amp; generate answer</button>
        </div>
        <div class="section">
            <label>Your answer (copy → send to host)</label>
            <textarea id="answer-out" readonly></textarea>
        </div>
    </div>

    <!-- Status -->
    <div class="section">
        <div class="status" id="status">Enter peer IDs to start</div>
    </div>

    <!-- Chat -->
    <div class="section">
        <label>Messages</label>
        <div class="log" id="log"></div>
        <div class="chat-input">
            <input id="msg" placeholder="Type a message…" disabled />
            <button id="send-btn" onclick="sendMsg()" disabled>Send</button>
        </div>
    </div>
</div>

<!-- v2/example/minimal-chat/index.html -->

<script type="module">
import init, { ChatApp } from './pkg/minimal_chat_example.js';

let app;
let myId, remoteId;

await init();

const $ = id => document.getElementById(id);
function status(t) { $('status').textContent = t; }
function log(t) {
    const el = $('log');
    el.textContent += (el.textContent ? '\n' : '') + t;
    el.scrollTop = el.scrollHeight;
}

// ---- Base64 helpers ----
function encodeBase64(str) {
    return btoa(str);
}

function decodeBase64(str) {
    try {
        return atob(str);
    } catch (e) {
        throw new Error('Invalid base64 string');
    }
}

// ---- Set IDs ----
window.setIds = function() {
    myId = $('my-id').value.trim();
    remoteId = $('remote-id').value.trim();
    //turn = $('turn').value.trim() ?? 'turn:demo-voicechat.quasarity.com:3478';
    let turn = 'turn:demo-voicechat.quasarity.com:3478';
    
    if (!myId || !remoteId) {
        return alert('Please enter both IDs');
    }
    
    if (myId === remoteId) {
        return alert('IDs must be different');
    }
    
    try {
        app = new ChatApp(myId, turn);
        
        app.onConnected(() => {
            status('Connected to ' + remoteId);
            log('--- connected ---');
            $('msg').disabled = false;
            $('send-btn').disabled = false;
        });
        
        app.onMessage((peer, data) => {
            const text = new TextDecoder().decode(data);
            log(peer + ': ' + text);
        });
        
        app.onDisconnected(() => {
            status('Disconnected');
            log('--- disconnected ---');
            $('msg').disabled = true;
            $('send-btn').disabled = true;
        });
        
        $('step-ids').classList.add('hidden');
        $('step-role').classList.remove('hidden');
        status('IDs set: ' + myId + ' ↔ ' + remoteId);
        log('My ID: ' + myId);
        log('Remote ID: ' + remoteId);
    } catch (e) {
        status('Error: ' + e);
    }
};

window.chooseHost = async function() {
    $('step-role').classList.add('hidden');
    $('host-flow').classList.remove('hidden');
    status('Generating offer…');
    try {
        const offer = await app.start_as_host(remoteId);
        // Кодируем в base64 для отображения
        console.log(offer);
        const encoded = encodeBase64(offer);
        $('offer-out').value = encoded;
        status('Offer ready (base64) — copy and send to ' + remoteId);
    } catch (e) { status('Error: ' + e); }
};

window.chooseJoiner = function() {
    $('step-role').classList.add('hidden');
    $('joiner-flow').classList.remove('hidden');
    status('Paste the base64 offer from ' + remoteId);
};

window.hostAcceptAnswer = async function() {
    const answerBase64 = $('answer-in').value.trim();
    if (!answerBase64) return alert('Paste the answer first');
    status('Connecting…');
    try {
        // Декодируем из base64
        const answer = decodeBase64(answerBase64);
        await app.accept_answer(answer);
    } catch (e) { 
        status('Error: ' + e);
        console.error(e);
    }
};

window.joinerAcceptOffer = async function() {
    const offerBase64 = $('offer-in').value.trim();
    if (!offerBase64) return alert('Paste the offer first');
    status('Generating answer…');
    try {
        // Декодируем из base64
        const offer = decodeBase64(offerBase64);
        const answer = await app.accept_offer(remoteId, offer);
        // Кодируем answer в base64
        console.log(answer);
        const encoded = encodeBase64(answer);
        $('answer-out').value = encoded;
        status('Answer ready (base64) — copy and send to ' + remoteId);
    } catch (e) { 
        status('Error: ' + e);
        console.error(e);
    }
};

window.sendMsg = async function() {
    const input = $('msg');
    const text = input.value.trim();
    if (!text) return;
    try {
        await app.send(text);
        log('You: ' + text);
        input.value = '';
    } catch (e) { status('Send error: ' + e); }
};

$('msg').addEventListener('keydown', e => {
    if (e.key === 'Enter') sendMsg();
});

log('Ready');
</script>

</body>
</html>
